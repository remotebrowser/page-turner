# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      demo:
        description: Deploy page-turner (demo)
        required: false
        type: boolean
        default: true
      gateway:
        description: Deploy page-turner-gateway
        required: false
        type: boolean
        default: true

jobs:
  prepare-matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.pm.outputs.matrix }}
    steps:
      - id: pm
        uses: remotebrowser/shared-github-actions/prepare-matrix@v1
        with:
          entries: |
            { "env": "demo",    "config": "demo",    "app_name": "page-turner",         "fly_toml": "fly.toml"        }
            { "env": "gateway", "config": "lambda_gateway", "app_name": "page-turner-gateway", "fly_toml": "fly.lambda.toml" }
          selections: |
            ${{ inputs.demo    && 'demo'    || '' }}
            ${{ inputs.gateway && 'gateway' || '' }}
          key-field: env

  deploy:
    needs: prepare-matrix
    name: Deploy ${{ matrix.app_name }}
    runs-on: ubuntu-22.04
    concurrency: deploy-${{ matrix.app_name }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: remotebrowser/shared-github-actions/deploy-fly@v1
        with:
          onepassword-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          fly-api-token: op://page-turner/${{ matrix.config }}/FLY_API_TOKEN
          # Each Fly secret of the app that is not listed here is unset.
          onepassword-secrets: |
            ENVIRONMENT=op://page-turner/${{ matrix.config }}/ENVIRONMENT
            GETGATHER_URL=op://page-turner/${{ matrix.config }}/GETGATHER_URL
            LOGFIRE_TOKEN=op://page-turner/${{ matrix.config }}/LOGFIRE_TOKEN
            REMOTEBROWSER_URL=op://page-turner/${{ matrix.config }}/REMOTEBROWSER_URL
            SENTRY_DSN=op://page-turner/${{ matrix.config }}/SENTRY_DSN
            ${{ matrix.config == 'lambda_gateway' && 'TAILSCALE_AUTHKEY=op://page-turner/lambda_gateway/TAILSCALE_AUTHKEY' || '' }}
          app-name: ${{ matrix.app_name }}
          fly-toml: ${{ matrix.fly_toml }}
